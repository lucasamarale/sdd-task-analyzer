# Requisitos do TaskAnalyzer em formato legível por máquina.
# Derivado de specs/task_analyzer_spec.md, versão 1.2 (MUD-15).
# Em caso de divergência, vale o Markdown.

projeto:
  nome: sdd-task-analyzer
  modulo: src/task_analyzer.py
  versao_especificacao: "1.2"
  autor: Lucas Amaral Evangelista
  fonte_da_verdade: specs/task_analyzer_spec.md

interface:
  funcao: analyze_tasks
  assinatura: "analyze_tasks(tarefas: list[Tarefa]) -> ResultadoAnalise"
  excecao: TaskValidationError
  excecao_base: ValueError
  pura: true

entrada:
  tipo: Tarefa
  estrutura: dataclass congelada
  campos:
    - nome: id_tarefa
      tipo: int
      obrigatorio: true
      restricoes: [inteiro positivo, unico no conjunto]
    - nome: data_criacao
      tipo: datetime
      obrigatorio: true
      restricoes: [ciente de fuso]
    - nome: prazo
      tipo: datetime
      obrigatorio: true
      restricoes: [ciente de fuso]
    - nome: prioridade
      tipo: str
      obrigatorio: true
      valores: [baixa, media, alta]
      sensivel_a_maiusculas: false
    - nome: status
      tipo: str
      obrigatorio: true
      valores: [concluida, pendente, cancelada]
      sensivel_a_maiusculas: true
    - nome: data_inicio
      tipo: datetime | None
      obrigatorio: false
      restricoes: [ciente de fuso, nao anterior a data_criacao]
    - nome: data_conclusao
      tipo: datetime | None
      obrigatorio: quando status for concluida
      restricoes: [ciente de fuso, nao anterior a data_criacao]

saida:
  tipo: ResultadoAnalise
  estrutura: TypedDict
  casas_decimais: 2
  campos:
    - nome: total_tarefas
      tipo: int
    - nome: total_concluidas
      tipo: int
    - nome: total_pendentes
      tipo: int
    - nome: tempo_medio_conclusao_horas
      tipo: float
      sem_concluidas: 0.0
    - nome: tempo_medio_por_prioridade_horas
      tipo: dict[str, float]
      chaves: [alta, media, baixa]
      sem_concluidas: 0.0
    - nome: taxa_atraso_percentual
      tipo: float
      intervalo: [0.0, 100.0]
      sem_concluidas: 0.0

regras_de_negocio:
  - id: RN-01
    regra: total_tarefas conta todas; total_concluidas as concluidas; total_pendentes as pendentes
  - id: RN-02
    regra: tempo de conclusao e data_conclusao menos data_criacao, em horas
  - id: RN-03
    regra: atraso e data_conclusao estritamente posterior ao prazo
  - id: RN-04
    regra: toda data precisa ser ciente de fuso
  - id: RN-05
    regra: arredondamento em duas casas apenas na saida
  - id: RN-06
    regra: tempo medio no geral e por prioridade; taxa de atraso no geral
  - id: RN-07
    regra: as tres prioridades aparecem sempre, com 0.0 sem concluida
  - id: RN-08
    regra: nenhuma divisao sem verificar o denominador
  - id: RN-09
    regra: lista vazia ou sem concluida devolve 0.0, sem excecao
  - id: RN-10
    regra: violacao de entrada levanta TaskValidationError citando id_tarefa e campo, antes de qualquer calculo
  - id: RN-11
    regra: funcao pura; nao altera a lista, nao usa arquivo, rede nem relogio

validacoes:
  excecao: TaskValidationError
  casos:
    - id_tarefa nao inteiro positivo ou repetido
    - prioridade fora da enumeracao
    - status fora da enumeracao
    - data sem fuso
    - tarefa concluida sem data_conclusao
    - data_conclusao anterior a data_criacao
    - data_inicio anterior a data_criacao

cenarios_de_aceite:
  - {id: CENARIO-1, tipo: sucesso, espera: "6 tarefas, 4 concluidas, 1 pendente, media 5.5 h, alta 3.0, media 6.0, baixa 10.0, atraso 50.0%"}
  - {id: CENARIO-2, tipo: excecao, espera: "TaskValidationError citando data_conclusao"}
  - {id: B-01, tipo: borda, espera: "lista vazia devolve zeros, sem excecao"}
  - {id: B-02, tipo: borda, espera: "so pendentes devolve medias e taxa 0.0, sem excecao"}
  - {id: C-01, espera: "conclusao exatamente no prazo nao e atraso"}
  - {id: C-02, espera: "prioridade invalida levanta erro"}
  - {id: C-03, espera: "prioridade em maiusculas e aceita"}
  - {id: C-04, espera: "data sem fuso levanta erro"}
  - {id: C-05, espera: "concluida sem data_conclusao levanta erro"}
  - {id: C-06, espera: "id repetido, zero ou negativo levanta erro"}
  - {id: C-07, espera: "status invalido levanta erro"}
  - {id: C-08, espera: "media 1 h, 2 h e 2 h arredonda para 1.67"}
  - {id: C-09, espera: "a lista recebida nao e alterada"}
  - {id: C-10, espera: "data_inicio anterior a criacao levanta erro"}
  - {id: C-11, espera: "1.5 h e 2.25 h dao media 1.88; nada e arredondado antes da media"}

governanca:
  regras_da_ia: CONTEXT_RULES.md
  dependencias_autorizadas:
    producao: []
    testes: [pytest]
  homologacao_humana:
    - pytest com 100% aprovado
    - conferencia contra as secoes 1.2, 1.3 e 1.4
    - conferencia contra cada item de CONTEXT_RULES.md
    - revisao de legibilidade, coesao e tratamento de erro
    - aprovacao registrada no Pull Request

entrega:
  ci:
    arquivo: .github/workflows/ci.yml
    gatilhos: [push, pull_request]
    branches: [main, develop]
    ambiente: ubuntu-latest
    python: "3.11"
    comando: pytest tests/test_harness.py -v
  container:
    imagem_base: python:3.11-slim
    dockerfile: Dockerfile
    compose: docker-compose.yml
    servico: tests
    comando: docker compose run --rm tests
